events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # HTTP to HTTPS redirect for API
    server {
        listen 80;
        server_name stage-api.daftarpro.com; # Change to api.daftarpro.com for prod
        return 301 https://$host$request_uri;
    }

    # HTTPS API Gateway Server Block
    server {
        listen 443 ssl;
        server_name stage-api.daftarpro.com; # Change to api.daftarpro.com for prod
        client_max_body_size 50m;

        # SSL Certificates (Loaded from your mounted /etc/letsencrypt folder)
        ssl_certificate /etc/letsencrypt/live/stage-api.daftarpro.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stage-api.daftarpro.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            # Strip duplicate CORS headers from Node.js backend
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Credentials';
            proxy_hide_header 'Access-Control-Allow-Headers';
            proxy_hide_header 'Access-Control-Allow-Methods';

            # Dynamic CORS matching
            set $cors_origin "";
            if ($http_origin ~* "^https?://.*(cloudfront\.net|daftarpro\.com|localhost:3000)$") {
                set $cors_origin $http_origin;
            }

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' '$http_access_control_request_headers' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            # Point to your backend container name in Docker Compose
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
            send_timeout 300;

            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
        }
    }
}
