global:
  scrape_interval: 15s     # How often Prometheus fetches metrics
  evaluation_interval: 15s # How often Prometheus evaluates alert rules

scrape_configs:
  # 1. Scrape metrics from your Node.js backend
  - job_name: 'backend'
    metrics_path: '/metrics' # Ensure your Node.js app exposes metrics on this path
    static_configs:
      - targets: ['backend:5000'] # Points to your backend service on internal Docker port 5000

  # 2. Scrape Prometheus self-metrics (Optional, but recommended)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
